id: clipper.adjustment.directionalBlur
category: adjustment
name: Directional Blur
label: Directional Blur
group: Visual/Blur
defaultDuration: 3
defaultParams: {"amount":10,"angle":0,"opacity":0.9,"target":"camera"}
paramControls:
  - key: amount
    label: Amount
    type: number
    min: 0
    max: 32
    step: 0.5
    defaultValue: 10
  - key: angle
    label: Angle
    type: number
    min: -180
    max: 180
    step: 1
    defaultValue: 0
  - key: opacity
    label: Opacity
    type: number
    min: 0
    max: 1
    step: 0.05
    defaultValue: 0.9
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{"value":"frame","label":"Frame"},{"value":"camera","label":"Camera"}]
