id: clipper.adjustment.glowBlur
category: adjustment
name: Glow Blur
label: Glow Blur
group: Visual/Blur
defaultDuration: 3
defaultParams:
  { "amount": 10, "brightness": 1.1, "opacity": 0.65, "target": "camera" }
paramControls:
  - key: amount
    label: Amount
    type: number
    min: 0
    max: 24
    step: 0.5
    defaultValue: 10
  - key: brightness
    label: Brightness
    type: number
    min: 0.8
    max: 2
    step: 0.05
    defaultValue: 1.1
  - key: opacity
    label: Opacity
    type: number
    min: 0
    max: 1
    step: 0.05
    defaultValue: 0.65
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{ "value": "frame", "label": "Frame" }, { "value": "camera", "label": "Camera" }]
