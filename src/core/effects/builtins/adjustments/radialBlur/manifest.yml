id: clipper.adjustment.radialBlur
category: adjustment
name: Radial Blur
label: Radial Blur
group: Visual/Blur
defaultDuration: 3
defaultParams: { "amount": 10, "focusX": 50, "focusY": 50, "radius": 34, "softness": 22, "target": "camera" }
paramControls:
  - key: amount
    label: Amount
    type: number
    min: 0
    max: 28
    step: 0.5
    defaultValue: 10
  - key: focusX
    label: Focus X
    type: number
    min: 0
    max: 100
    step: 1
    defaultValue: 50
  - key: focusY
    label: Focus Y
    type: number
    min: 0
    max: 100
    step: 1
    defaultValue: 50
  - key: radius
    label: Radius
    type: number
    min: 1
    max: 80
    step: 1
    defaultValue: 34
  - key: softness
    label: Softness
    type: number
    min: 0
    max: 40
    step: 1
    defaultValue: 22
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{ "value": "frame", "label": "Frame" }, { "value": "camera", "label": "Camera" }]
