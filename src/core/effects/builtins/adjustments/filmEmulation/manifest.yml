id: clipper.adjustment.filmEmulation
category: adjustment
name: Film Emulation
label: Film Emulation
group: Practical
defaultDuration: 3
defaultParams: { "intensity": 0.82, "target": "camera", "stock": "warmNegative", "grain": 0.54, "grainSize": 1, "dust": 0.18, "dustSize": 1, "dustShape": 0.45, "scratches": 0.12, "scratchLength": 1, "scratchRoughness": 0.6, "halation": 0.34, "flicker": 0.18, "gateWeave": 0.1, "vignette": 0.22, "warmth": 0.42, "contrast": 0.18, "saturation": -0.08, "fade": 0.1, "motionSpeed": 1, "grainSpeed": 1, "dustSpeed": 1, "scratchSpeed": 1, "flickerSpeed": 1, "weaveSpeed": 1, "useMask": false, "maskPreview": false, "maskInvert": false, "maskShape": "circular", "maskFocusX": 50, "maskFocusY": 50, "maskRadius": 220, "maskRadiusX": 220, "maskRadiusY": 220, "maskFeather": 40, "seed": 17 }
paramControls:
