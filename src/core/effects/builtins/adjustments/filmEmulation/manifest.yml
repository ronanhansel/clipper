      display: dialog
  - key: scratches
    label: Scratches
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.12
    inlineGroup: artifactDustAmount
    section:
      key: filmEmulationArtifacts
      label: Artifacts
      display: dialog
