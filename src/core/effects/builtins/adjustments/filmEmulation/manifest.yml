      key: filmEmulationArtifacts
      label: Artifacts
      display: dialog
  - key: scratchRoughness
    label: Scratch Roughness
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.6
    inlineGroup: artifactScratchShape
    section:
      key: filmEmulationArtifacts
      label: Artifacts
      display: dialog
  - key: halation
    label: Halation
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.34
    inlineGroup: artifactLight
    section:
      key: filmEmulationArtifacts
      label: Artifacts
      display: dialog
