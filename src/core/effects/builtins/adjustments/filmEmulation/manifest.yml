    label: Target
    type: select
    defaultValue: camera
    options: [{ "value": "camera", "label": "Camera" }, { "value": "frame", "label": "Frame" }]
  - key: stock
    label: Stock
    type: select
    defaultValue: warmNegative
    options:
      - value: warmNegative
        label: Warm Negative
      - value: printFilm
        label: Print Film
      - value: reversal
        label: Reversal
      - value: fadedArchive
        label: Faded Archive
      - value: monochrome
        label: Monochrome
  - key: intensity
    label: Intensity
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.82
  - key: useMask
    label: Use mask
    type: boolean
    defaultValue: false
    section:
      key: filmEmulationArtifacts
      label: Artifacts
      display: dialog
      inlineGroup: filmEmulationTopButtons
  - key: motionSpeed
    label: Speed
    type: number
    min: 0
    max: 4
    step: 0.05
    defaultValue: 1
