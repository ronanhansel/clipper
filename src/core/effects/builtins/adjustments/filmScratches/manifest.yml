id: clipper.adjustment.filmScratches
category: adjustment
name: Film Scratches
label: Film Scratches
group: Overlay
defaultDuration: 3
defaultParams: {"intensity":0.24,"density":1,"drift":1,"target":"camera"}
paramControls:
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{"value":"camera","label":"Camera"},{"value":"frame","label":"Frame"}]
  - key: intensity
    label: Intensity
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.24
  - key: density
    label: Density
    type: number
    min: 0.25
    max: 3
    step: 0.05
    defaultValue: 1
  - key: drift
    label: Jitter
    type: number
    min: 0
    max: 4
    step: 0.05
    defaultValue: 1
