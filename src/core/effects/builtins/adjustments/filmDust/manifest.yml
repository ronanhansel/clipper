id: clipper.adjustment.filmDust
category: adjustment
name: Film Dust
label: Film Dust
group: Overlay
defaultDuration: 3
defaultParams:
  { "intensity": 0.28, "density": 1, "drift": 1, "target": "camera" }
paramControls:
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{ "value": "camera", "label": "Camera" }, { "value": "frame", "label": "Frame" }]
  - key: intensity
    label: Intensity
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.28
  - key: density
    label: Density
    type: number
    min: 0.25
    max: 3
    step: 0.05
    defaultValue: 1
  - key: drift
    label: Drift
    type: number
    min: 0
    max: 4
    step: 0.05
    defaultValue: 1
