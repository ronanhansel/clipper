    label: Rim Distortion
    type: number
    min: -4
    max: 4
    step: 0.05
    defaultValue: 0.32
  - key: chromaticAberration
    label: Chromatic Aberration px
    type: number
    min: -96
    max: 96
    step: 1
    defaultValue: 0.55
