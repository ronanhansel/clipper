    label: Softness
    type: number
    min: 0.05
    max: 1
    step: 0.01
    defaultValue: 0.62
  - key: magnification
    label: Magnification
    type: number
    min: 0.75
    max: 1.65
    step: 0.01
    defaultValue: 1.12
  - key: distortion
    label: Rim Distortion
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.32
  - key: chromaticAberration
    label: Chromatic Aberration
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.55
  - key: rimWidth
    label: Rim Width
    type: number
    min: 0.04
    max: 0.45
    step: 0.01
    defaultValue: 0.18
  - key: rimOpacity
    label: Rim Opacity
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.48
  - key: dimAmount
    label: Outside Dim
    type: number
    min: 0
    max: 0.8
    step: 0.01
    defaultValue: 0.28
pointControls:
