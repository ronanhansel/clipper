id: clipper.adjustment.lense
category: adjustment
name: Lense
label: Lense
group: Lense
defaultDuration: 3
defaultParams: {"target":"camera","focusX":50,"focusY":50,"radius":34,"softness":0.62,"magnification":1.12,"distortion":0.32,"chromaticAberration":0.55,"rimWidth":0.18,"rimOpacity":0.48,"dimAmount":0.28}
paramControls:
