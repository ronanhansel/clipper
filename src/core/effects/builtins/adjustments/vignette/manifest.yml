id: clipper.adjustment.vignette
category: adjustment
name: Vignette
label: Vignette
group: Overlay
defaultDuration: 3
defaultParams: {"intensity":0.42,"softness":0.64,"focusX":50,"focusY":50,"target":"camera"}
paramControls:
  - key: target
    label: Target
    type: select
    defaultValue: camera
    options: [{"value":"camera","label":"Camera"},{"value":"frame","label":"Frame"}]
  - key: intensity
    label: Intensity
    type: number
    min: 0
    max: 1
    step: 0.01
    defaultValue: 0.42
  - key: softness
    label: Softness
    type: number
    min: 0.2
    max: 1
    step: 0.01
    defaultValue: 0.64
pointControls:
  - label: Focus
    xKey: focusX
    yKey: focusY
    xDefault: 50
    yDefault: 50
    coordinateSpace: percent
    pickLabel: Pick Focus
