id: clipper.transition.scaleFade
category: transition
name: Scale Fade
label: Scale Fade
group: Dissolve
tags: ["blocksOverlap"]
defaultDuration: 2
defaultParams: { "ease": "linear", "transitionTime": 2, "scaleOut": 1.08, "scaleIn": 1.08 }
paramControls:
  - key: scaleOut
    label: Scale Out
    type: number
    min: 0.5
    max: 2
    step: 0.01
