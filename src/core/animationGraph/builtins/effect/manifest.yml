id: clipper.animationGraph.effect
kind: effect
name: Effect Mix
label: Effect Mix
connectionRules: ["typedSockets", "acyclic", "noDuplicateEffectForTime"]
flow: { "transparent": true }
inputs:
  - id: structure
    label: Structure
    type: Structure.Object
    accepts:
      [
        "Structure.Shape",
        "Structure.TextObject",
        "Structure.RichTextObject",
        "Structure.TextTokens",
        "Structure.Object",
      ]
  - id: controller
    label: Controller
    type: AnimationController
  - id: effect
    label: CSS Effect
    type: Effect.CSSEffect
outputs:
  - id: effect
    label: CSS Effect
    type: Effect.CSSEffect
