id: clipper.animationGraph.split
kind: split
name: Split
label: Split
connectionRules: ["typedSockets", "acyclic"]
flow: { "timingMode": "overlay", "transparent": true }
inputs:
  - id: source
    label: Source
    type: Structure.TextObject
    accepts:
      [
        "Structure.Object",
        "Structure.TextObject",
        "Value.String",
        "Value.Number",
        "Value.StringArray",
        "Value.NumberArray",
      ]
  - id: controller
    label: Controller
    type: AnimationController
outputs:
  - id: items
    label: Items
    type: Structure.TextTokens
  - id: controller
    label: Controller
    type: AnimationController
